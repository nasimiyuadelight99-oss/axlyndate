<!DOCTYPE html>

<title>Axlyndate - Meet Your Luxury Love</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui;background:#000;color:#fff}
.hero{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.75) 75%,rgba(0,0,0,.9) 100%);z-index:1;pointer-events:none}
.top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;background:#EBC99A;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:800;font-size:14px}
.brand-name{font-weight:700;font-size:14px}
.badge{font-size:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:999px}
.content{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:0 20px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.kicker{color:#EBC99A;font-size:9px;letter-spacing:.18em;font-weight:700;margin-bottom:6px}
h1{font-size:28px;line-height:.95;font-weight:800;margin-bottom:6px}
.sub{color:rgba(255,255,255,.75);font-size:12px;margin-bottom:14px}
.btn{width:100%;height:46px;border-radius:24px;border:none;font-weight:700;font-size:13px;margin-bottom:8px;cursor:pointer;position:relative;z-index:10}
.btn-google{background:#fff;color:#000}
.btn-gold{background:linear-gradient(90deg,#EBC99A,#C5A680);color:#000}
.btn-outline{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.counter{position:absolute;top:62px;right:12px;z-index:3;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:999px;font-size:10px}
.modal{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);align-items:flex-end}
.modal.open{display:flex}
.sheet{width:100%;background:#111;border-radius:28px 28px 0 0;padding:24px;border-top:1px solid rgba(255,255,255,.1)}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet p{color:rgba(255,255,255,.6);font-size:12px;margin-bottom:16px}
.input{width:100%;height:46px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:0 14px;margin-bottom:10px;font-size:14px}
.close{width:100%;height:46px;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:24px;margin-top:8px;font-weight:600}
</style>
</head>

<button class="btn btn-outline" onclick="openModal('login')">Login</button>
</div>
</div>
